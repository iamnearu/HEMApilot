[project]
name = "ingestion-service"
version = "0.1.0"
description = "Ingestion Microservice"
authors = [{name = "iamnearu"}]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "pydantic>=2.7.0",
    "slack-sdk>=3.27.0",
    "firecrawl-py>=1.0.0",
    "google-auth>=2.29.0",
    "google-api-python-client>=2.124.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
