[project]
name = "generation-service"
version = "0.1.0"
description = "Generation Microservice"
authors = [{name = "iamnearu"}]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "pydantic>=2.7.0",
    "langchain>=0.1.13",
    "langgraph>=0.0.30",
    "langchain-anthropic>=0.1.4",
    "langchain-google-vertexai>=0.1.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
