[project]
name = "publishing-service"
version = "0.1.0"
description = "Publishing Microservice"
authors = [{name = "iamnearu"}]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "pydantic>=2.7.0",
    "tweepy>=4.14.0",
    "httpx>=0.27.0", # For LinkedIn API or Arcade
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
